[package]
name = "multi-codex-desktop"
version = "1.4.1"
description = "Run isolated Codex accounts in separate VS Code windows"
default-run = "multi-codex-desktop"
authors = ["Russell Daniel Paul"]
license = "MIT"
edition = "2021"

[lib]
name = "multi_codex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "multi-codex-account-helper"
path = "src/bin/account-helper.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs2 = "0.4"
keyring = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", default-features = false, features = ["wry", "x11", "dbus", "image-png", "tray-icon"] }
tempfile = "3"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
sysinfo = "0.37"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }
