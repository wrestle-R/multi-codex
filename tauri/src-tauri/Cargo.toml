[package]
name = "multi-codex-desktop"
version = "0.1.0"
description = "Run isolated Codex accounts in separate VS Code windows"
authors = ["Russell Daniel Paul"]
license = "MIT"
edition = "2021"

[lib]
name = "multi_codex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", default-features = false, features = ["wry", "x11", "dbus"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
