name: AppImage catalog probe

on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Prior probe run containing the exact AppImage (leave empty to build)
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - name: Install native probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y firejail gdb icewm imagemagick libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm strace x11-utils xdotool xvfb
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.candidate_run == ''
      - uses: Swatinem/rust-cache@v2
        if: inputs.candidate_run == ''
        with:
          workspaces: tauri/src-tauri
      - run: npm ci
        if: inputs.candidate_run == ''
      - run: npm run release:linux
        if: inputs.candidate_run == ''
      - name: Reuse exact candidate from a prior probe
        if: inputs.candidate_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$CANDIDATE_RUN" --name appimage-probe --dir "$RUNNER_TEMP/prior-probe"
          mkdir -p src-tauri/target/release/bundle/appimage
          find "$RUNNER_TEMP/prior-probe" -type f -name '*.AppImage' -exec cp {} src-tauri/target/release/bundle/appimage/ \;
      - name: Compare catalog startup environments
        run: |
          APPIMAGE_SMOKE_EVIDENCE_DIR="$RUNNER_TEMP/appimage-probe/cold-raw-xvfb" bash scripts/appimage-catalog-display-smoke.sh src-tauri/target/release/bundle/appimage/*.AppImage >"$RUNNER_TEMP/appimage-probe-cold-raw-xvfb.log" 2>&1 && result=passed || result=failed
          echo "cold-raw-xvfb: $result"
          tail -n 100 "$RUNNER_TEMP/appimage-probe-cold-raw-xvfb.log"
          for mode in no-webkit-sandbox window-manager catalog; do
            extra_wait=20
            [[ "$mode" != extended-startup ]] || extra_wait=50
            APPIMAGE_SMOKE_BACKTRACE=1 APPIMAGE_SMOKE_EXTRA_WAIT_SECONDS="$extra_wait" APPIMAGE_SMOKE_MODE="$mode" APPIMAGE_SMOKE_EVIDENCE_DIR="$RUNNER_TEMP/appimage-probe/$mode" xvfb-run -a bash scripts/appimage-catalog-smoke.sh src-tauri/target/release/bundle/appimage/*.AppImage >"$RUNNER_TEMP/appimage-probe-$mode.log" 2>&1 && result=passed || result=failed
            echo "$mode: $result"
            tail -n 100 "$RUNNER_TEMP/appimage-probe-$mode.log"
          done
          Xvfb :98 -screen 0 800x600x24 >"$RUNNER_TEMP/raw-xvfb.log" 2>&1 & raw_xvfb_pid=$!
          sleep 2
          DISPLAY=:98 APPIMAGE_SMOKE_EVIDENCE_DIR="$RUNNER_TEMP/appimage-probe/raw-xvfb" env -u XAUTHORITY bash scripts/appimage-catalog-smoke.sh src-tauri/target/release/bundle/appimage/*.AppImage >"$RUNNER_TEMP/appimage-probe-raw-xvfb.log" 2>&1 && result=passed || result=failed
          echo "raw-xvfb: $result"
          tail -n 100 "$RUNNER_TEMP/appimage-probe-raw-xvfb.log"
          kill "$raw_xvfb_pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-probe
          path: |
            ${{ runner.temp }}/appimage-probe/
            ${{ runner.temp }}/appimage-probe-*.log
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
