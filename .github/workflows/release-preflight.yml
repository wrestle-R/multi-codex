name: Release preflight

on:
  workflow_call:
    inputs:
      check_local_extension:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tauri

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-layer-shell-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tauri/package-lock.json
            extension/package-lock.json
      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tauri/src-tauri

      - run: npm ci
      - run: npm run check:secrets
      - run: npm run test:release
      - run: npm test
      - run: npm run test:release-gates
      - run: npm run build:desktop
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and test the local VS Code extension
        if: inputs.check_local_extension
        run: |
          npm --prefix ../extension run build:helper
          npm --prefix ../extension test
          npm --prefix ../extension run package -- --target linux-x64
