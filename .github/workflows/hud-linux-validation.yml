name: HUD GNOME and KDE native validation
on:
  workflow_dispatch:
  push:
    branches: ['codex/hud-backend-*']
    paths-ignore:
      - '.github/workflows/hud-backend-validation.yml'
      - 'release/scripts/macos-lifecycle-probe.py'
      - 'tauri/scripts/test-hud-desktop.mjs'
permissions:
  contents: read
jobs:
  kde:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install Fedora build and native Plasma dependencies
        run: |
          dnf install -y git tar gzip curl gcc gcc-c++ make pkgconf-pkg-config openssl-devel nodejs npm python3-gobject gtk3-devel webkit2gtk4.1-devel gtk-layer-shell-devel libappindicator-gtk3-devel librsvg2-devel patchelf kwin-wayland qt6-qtwayland mesa-dri-drivers dbus-daemon dbus-tools systemd fuse3 dejavu-sans-fonts xkeyboard-config
          # Fedora assigns CAP_SYS_NICE to KWin; Docker refuses exec because it
          # is outside the default capability bounding set. This virtual test
          # compositor does not need real-time scheduling.
          setcap -r "$(command -v kwin_wayland)"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
          key: fedora-kde
          cache-on-failure: true
      - name: Build current native launcher
        run: |
          npm ci --prefix extension
          npm ci --prefix tauri
          node tauri/scripts/build-desktop-resources.mjs --bridge-only
          npm run build --prefix tauri
          cargo build --locked --manifest-path tauri/src-tauri/Cargo.toml --bin multi-codex-desktop --no-default-features
      - name: Verify actual Orbit in a disposable Plasma compositor
        env:
          HUD_EVIDENCE: ${{ runner.temp }}/kde-hud-evidence
          HUD_LAUNCHER: ${{ github.workspace }}/tauri/src-tauri/target/debug/multi-codex-desktop
          # Only this disposable root-owned CI container lacks user namespaces.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: |
          mkdir -p "$HUD_EVIDENCE"
          export HUD_LAUNCHER="$PWD/tauri/src-tauri/target/debug/multi-codex-desktop"
          npm run dev --prefix tauri -- --host 127.0.0.1 > "$HUD_EVIDENCE/vite.log" 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do curl -sSf http://127.0.0.1:1420/ >/dev/null && break || sleep 1; done
          bash tauri/scripts/test-hud-kde-session.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kde-hud-native-evidence
          path: ${{ runner.temp }}/kde-hud-evidence/
          if-no-files-found: warn

  gnome:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
          cache-on-failure: true
      - name: Install native GNOME and Tauri libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell python3-gi dbus-x11 libwebkit2gtk-4.1-dev libgtk-layer-shell-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          gnome-shell --version
          gnome-shell --help
      - name: Build current native launcher
        run: |
          npm ci --prefix extension
          npm ci --prefix tauri
          node tauri/scripts/build-desktop-resources.mjs --bridge-only
          npm run build --prefix tauri
          cargo build --locked --manifest-path tauri/src-tauri/Cargo.toml --bin multi-codex-desktop --no-default-features
      - name: Start disposable GNOME session and verify actual HUD
        env:
          HUD_EVIDENCE: ${{ runner.temp }}/gnome-hud-evidence
          HUD_LAUNCHER: ${{ github.workspace }}/tauri/src-tauri/target/debug/multi-codex-desktop
        run: |
          mkdir -p "$HUD_EVIDENCE"
          npm run dev --prefix tauri -- --host 127.0.0.1 > "$HUD_EVIDENCE/vite.log" 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do curl -sSf http://127.0.0.1:1420/ >/dev/null && break || sleep 1; done
          dbus-run-session -- bash tauri/scripts/test-hud-gnome-session.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-hud-native-evidence
          path: ${{ runner.temp }}/gnome-hud-evidence/
          if-no-files-found: warn
