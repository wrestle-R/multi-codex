name: Exact Intel Mac extension recheck
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Release run containing a native-tested Intel Mac VSIX
        required: true
permissions:
  contents: read
  actions: read
jobs:
  editor:
    runs-on: macos-26-intel
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Verify production source and stage the exact native-tested package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          source_sha=$(gh run view "$CANDIDATE_RUN" --json headSha --jq .headSha)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(gh run view "$CANDIDATE_RUN" --json jobs --jq '.jobs[]|select(.name=="extensions / darwin-x64")|.conclusion')" == success ]]
          git fetch --depth=1 origin "$source_sha"
          git diff --quiet "$source_sha" HEAD -- ../cli/crates/core src package.json package-lock.json ':(exclude)src/vscode-tests.ts'
          gh run download "$CANDIDATE_RUN" --name extension-darwin-x64 --dir "$RUNNER_TEMP/candidate"
          version=$(node -p 'require("./package.json").version')
          vsix="$RUNNER_TEMP/candidate/multi-codex-darwin-x64-$version.vsix"
          test -f "$vsix"
          mkdir "$RUNNER_TEMP/packaged-extension"
          unzip -q "$vsix" -d "$RUNNER_TEMP/packaged-extension"
          helper="$RUNNER_TEMP/packaged-extension/extension/bin/multi-codex-account-helper"
          test -x "$helper"
          codesign --verify --strict "$helper"
          mkdir -p bin
          cp -p "$helper" bin/multi-codex-account-helper
          cp "$vsix" .
          CANDIDATE_SOURCE="$source_sha" CANDIDATE_VSIX="$vsix" node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; import {createHash} from "node:crypto"; writeFileSync("package-reuse.json",JSON.stringify({candidateSource:process.env.CANDIDATE_SOURCE,harnessSource:process.env.GITHUB_SHA,productionSourceIdentical:true,vsixSha256:createHash("sha256").update(readFileSync(process.env.CANDIDATE_VSIX)).digest("hex")}));'
          echo "MULTI_CODEX_TEST_DEVELOPMENT_PATH=$RUNNER_TEMP/packaged-extension/extension" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          npm ci
          npm run build
      - name: Install pinned official VS Code and Codex into disposable directories
        env:
          VSCODE_PLATFORM: darwin
        run: |
          curl --fail --location --retry 3 --max-time 300 "https://update.code.visualstudio.com/1.140.0/$VSCODE_PLATFORM/stable" -o "$RUNNER_TEMP/vscode.archive"
          mkdir "$RUNNER_TEMP/vscode" "$RUNNER_TEMP/codex-extensions"
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            ditto -xk "$RUNNER_TEMP/vscode.archive" "$RUNNER_TEMP/vscode"
            code_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$RUNNER_TEMP/vscode/Visual Studio Code.app/Contents/Info.plist")
            code_binary="$RUNNER_TEMP/vscode/Visual Studio Code.app/Contents/MacOS/$code_executable"
            code_cli="$RUNNER_TEMP/vscode/Visual Studio Code.app/Contents/Resources/app/bin/code"
          else
            tar -xzf "$RUNNER_TEMP/vscode.archive" -C "$RUNNER_TEMP/vscode" --strip-components=1
            code_binary="$RUNNER_TEMP/vscode/code"
            code_cli="$RUNNER_TEMP/vscode/bin/code"
          fi
          test -x "$code_binary"
          for attempt in 1 2 3; do
            if "$code_cli" --user-data-dir "$RUNNER_TEMP/install-profile" --extensions-dir "$RUNNER_TEMP/codex-extensions" --install-extension openai.chatgpt@26.1002.51308 --force; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 5
          done
          codex_extension=$(find "$RUNNER_TEMP/codex-extensions" -maxdepth 1 -type d -name 'openai.chatgpt-*' -print -quit)
          test -n "$codex_extension"
          export codex_extension
          codex_engine=$(node --input-type=module -e 'import { createRequire } from "node:module"; const { bundledEnginePath } = createRequire(import.meta.url)("./dist/core.cjs"); console.log(await bundledEnginePath(process.env.codex_extension));')
          test -x "$codex_engine"
          "$codex_engine" --version
          echo "MULTI_CODEX_TEST_VSCODE=$code_binary" >> "$GITHUB_ENV"
          echo "MULTI_CODEX_TEST_EXTENSION=$codex_extension" >> "$GITHUB_ENV"
          echo "MULTI_CODEX_TEST_ENGINE=$codex_engine" >> "$GITHUB_ENV"
      - name: Recheck native protocol, credential storage and account guards
        run: npm test
      - name: Recheck exact packaged live attachment
        run: |
          MULTI_CODEX_TEST_LIVE_ATTACH=1 node scripts/test-vscode.mjs
          cp .test-results/vscode-result.json .test-results/packaged-live-attachment.json
      - name: Recheck actual New Chat, selected sessions and account restoration
        env:
          MULTI_CODEX_TEST_ORBIT_UI: '1'
        run: |
          node scripts/test-vscode.mjs
          cp .test-results/vscode-result.json .test-results/packaged-startup.json
      - name: Require the tested package bytes to remain unchanged
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {createHash} from "node:crypto"; import assert from "node:assert/strict"; const proof=JSON.parse(readFileSync("package-reuse.json")); const v=JSON.parse(readFileSync("package.json")).version; assert.equal(createHash("sha256").update(readFileSync(`multi-codex-darwin-x64-${v}.vsix`)).digest("hex"),proof.vsixSha256);'
          cp package-reuse.json .test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: extension-darwin-x64
          path: extension/multi-codex-darwin-x64-${{ env.PACKAGE_VERSION }}.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-evidence-darwin-x64
          path: extension/.test-results/
          include-hidden-files: true
          if-no-files-found: warn
