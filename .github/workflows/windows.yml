name: Windows native validation
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/windows-release']
    paths: ['tauri/**', 'extension/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['tauri/**', 'extension/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - run: npm ci
        working-directory: tauri
      - run: npm run build
        working-directory: tauri
      - run: cargo fmt --manifest-path tauri/src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path tauri/src-tauri/Cargo.toml
      - run: npm test
        working-directory: tauri
      - run: npm ci
        working-directory: extension
      - run: npm run build:helper
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.windows.conf.json
        working-directory: tauri
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
