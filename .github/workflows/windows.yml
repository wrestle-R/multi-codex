name: Windows native validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tauri/**', 'extension/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['tauri/**', 'extension/**', '.github/workflows/windows.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - run: npm ci
        working-directory: tauri
      - run: npm run build
        working-directory: tauri
      - run: cargo fmt --manifest-path tauri/src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path tauri/src-tauri/Cargo.toml
      - run: npm test
        working-directory: tauri
      - run: npm ci
        working-directory: extension
      - run: npm run build:helper
        working-directory: extension
      - name: Install official VS Code and Codex extension in disposable directories
        shell: pwsh
        run: |
          $codeRoot = Join-Path $env:RUNNER_TEMP 'vscode'
          Invoke-WebRequest 'https://update.code.visualstudio.com/1.140.0/win32-x64-archive/stable' -OutFile "$env:RUNNER_TEMP/vscode.zip"
          Expand-Archive "$env:RUNNER_TEMP/vscode.zip" $codeRoot
          $extensions = Join-Path $env:RUNNER_TEMP 'codex-extensions'
          & "$codeRoot/bin/code.cmd" --user-data-dir "$env:RUNNER_TEMP/install-profile" --extensions-dir $extensions --install-extension openai.chatgpt@26.1002.51308 --force
          if ($LASTEXITCODE -ne 0) { throw 'Official extension installation failed' }
          $official = (Get-ChildItem $extensions -Directory -Filter 'openai.chatgpt-*' | Select-Object -First 1).FullName
          if (!$official) { throw 'Official extension missing' }
          "MULTI_CODEX_TEST_VSCODE=$codeRoot/Code.exe" >> $env:GITHUB_ENV
          "MULTI_CODEX_TEST_EXTENSION=$official" >> $env:GITHUB_ENV
          "MULTI_CODEX_TEST_ENGINE=$official/bin/windows-x86_64/codex.exe" >> $env:GITHUB_ENV
      - run: npm test
        working-directory: extension
      - name: Package Windows VSIX and extract the exact package for UI tests
        working-directory: extension
        shell: pwsh
        run: |
          npm run package:platform -- win32-x64
          if ($LASTEXITCODE -ne 0) { throw 'VSIX packaging failed' }
          $manifest = Get-Content package.json | ConvertFrom-Json
          $vsix = "$($manifest.name)-win32-x64-$($manifest.version).vsix"
          Copy-Item $vsix "$env:RUNNER_TEMP/extension.zip"
          Expand-Archive "$env:RUNNER_TEMP/extension.zip" "$env:RUNNER_TEMP/packaged-extension"
          "MULTI_CODEX_TEST_DEVELOPMENT_PATH=$env:RUNNER_TEMP/packaged-extension/extension" >> $env:GITHUB_ENV
      - name: Verify packaged live attachment in real Windows VS Code
        working-directory: extension
        shell: pwsh
        run: |
          $env:MULTI_CODEX_TEST_LIVE_ATTACH='1'
          node scripts/test-vscode.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows live attachment failed' }
          Copy-Item .test-results/vscode-result.json .test-results/packaged-live-attachment.json
      - name: Verify packaged native wrapper startup and account restoration
        working-directory: extension
        shell: pwsh
        run: |
          node scripts/test-vscode.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows startup failed' }
          Copy-Item .test-results/vscode-result.json .test-results/packaged-startup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-extension-evidence
          path: extension/.test-results/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: extension-win32-x64
          path: extension/*-win32-x64-*.vsix

      - run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.windows.conf.json
        working-directory: tauri
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
