name: Released installer verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose exact DMG should be installed
        required: true

permissions:
  contents: read
  actions: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tauri/scripts/installers.test.mjs
      - name: Retrieve checksum-verified AppImage build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_run_id=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(f"release/evidence/{os.environ['CANDIDATE_TAG']}-local-validation.json").read_text())
          assert 'v' + report['version'] == os.environ['CANDIDATE_TAG']
          print(report['releaseRun'].rsplit('/', 1)[1])
          PY
          )
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          mkdir "$RUNNER_TEMP/installer-assets"
          gh run download "$source_run_id" --name linux-packages --dir "$RUNNER_TEMP/installer-assets"
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          report = json.loads(Path(f"release/evidence/{os.environ['CANDIDATE_TAG']}-local-validation.json").read_text())
          assets = Path(os.environ['RUNNER_TEMP']) / 'installer-assets'
          name = f"Multi.Codex_{report['version']}_amd64.AppImage"
          source = next(assets.rglob(name))
          expected = report['artifacts'][name]
          assert hashlib.sha256(source.read_bytes()).hexdigest() == expected
          if source != assets / name:
              shutil.copyfile(source, assets / name)
          (assets / 'SHA256SUMS').write_text(f'{expected}  {name}\n')
          PY
      - name: Install and update the actual AppImage without changing account data
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: python3 tauri/scripts/linux-installer-smoke.py "$RUNNER_TEMP/installer-assets" "$CANDIDATE_TAG" "$RUNNER_TEMP/linux-installer-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer-evidence
          path: ${{ runner.temp }}/linux-installer-result.json
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check installer regressions
        run: |
          bash -n scripts/install-app.sh scripts/update-app.sh
          node --test tauri/scripts/installers.test.mjs
      - name: Download exact candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          mkdir "$RUNNER_TEMP/installer-assets"
          if ! gh release download "$CANDIDATE_TAG" --dir "$RUNNER_TEMP/installer-assets" --pattern '*_aarch64.dmg' --pattern SHA256SUMS; then
            # Read-only tokens cannot see private drafts. Retrieve the same DMG
            # from its original build and verify the recorded release hash.
            source_run_id=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(f"release/evidence/{os.environ['CANDIDATE_TAG']}-local-validation.json").read_text())
          assert 'v' + report['version'] == os.environ['CANDIDATE_TAG']
          print(report['releaseRun'].rsplit('/', 1)[1])
          PY
            )
            [[ "$source_run_id" =~ ^[0-9]+$ ]]
            gh run download "$source_run_id" --name macos-package --dir "$RUNNER_TEMP/installer-assets"
            python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          report = json.loads(Path(f"release/evidence/{os.environ['CANDIDATE_TAG']}-local-validation.json").read_text())
          assets = Path(os.environ['RUNNER_TEMP']) / 'installer-assets'
          name = f"Multi.Codex_{report['version']}_aarch64.dmg"
          expected = report['artifacts'][name]
          assert hashlib.sha256((assets / name).read_bytes()).hexdigest() == expected
          (assets / 'SHA256SUMS').write_text(f'{expected}  {name}\n')
          PY
          fi
      - name: Install and update the real DMG in disposable profiles
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: python3 tauri/scripts/macos-installer-smoke.py "$RUNNER_TEMP/installer-assets" "$CANDIDATE_TAG"
      - name: Upload native installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-evidence
          path: |
            ${{ runner.temp }}/multi-codex-macos-installer-evidence/
            ${{ runner.temp }}/multi-codex-macos-evidence/
          if-no-files-found: warn
