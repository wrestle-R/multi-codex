name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - name: Validate tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${RELEASE_TAG#v}"
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const expected = process.env.VERSION;
            const actual = [
              JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              JSON.parse(fs.readFileSync("package-lock.json", "utf8")).version,
              JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1],
              fs.readFileSync("src-tauri/Cargo.lock", "utf8").match(/name = "multi-codex-desktop"\nversion = "([^"]+)"/)?.[1],
            ];
            if (actual.some(version => version !== expected)) {
              throw new Error(`Tag ${expected} does not match committed versions: ${actual.join(", ")}`);
            }
          '
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run test:release
      - run: npm run release:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/release/bundle/deb/*.deb
            tauri/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - name: Validate tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${RELEASE_TAG#v}"
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const expected = process.env.VERSION;
            const actual = [
              JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              JSON.parse(fs.readFileSync("package-lock.json", "utf8")).version,
              JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1],
              fs.readFileSync("src-tauri/Cargo.lock", "utf8").match(/name = "multi-codex-desktop"\nversion = "([^"]+)"/)?.[1],
            ];
            if (actual.some(version => version !== expected)) {
              throw new Error(`Tag ${expected} does not match committed versions: ${actual.join(", ")}`);
            }
          '
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles app,dmg --target universal-apple-darwin
      - name: Inspect and smoke-test universal app bundle
        run: |
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          BINARY="$APP/Contents/MacOS/$EXECUTABLE"
          test -x "$BINARY"
          test -f "$APP/Contents/Resources/icon.icns"
          ARCHS=$(lipo -archs "$BINARY")
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " == *" x86_64 "* ]]
          TEST_HOME=$(mktemp -d)
          trap 'rm -rf "$TEST_HOME"' EXIT
          HOME="$TEST_HOME" "$BINARY" >"$RUNNER_TEMP/multi-codex-macos.log" 2>&1 &
          PID=$!
          sleep 5
          kill -0 "$PID"
          kill "$PID"
          wait "$PID" || true
      - name: Normalize DMG name
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)
          test -n "$DMG"
          mv "$DMG" "Multi.Codex_${VERSION}_universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: tauri/Multi.Codex_*_universal.dmg
          if-no-files-found: error

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-assets
          merge-multiple: true
      - name: Verify and publish assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          find downloaded-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          cd release-assets
          mapfile -d '' ASSETS < <(find . -maxdepth 1 -type f -print0 | sort -z)
          ((${#ASSETS[@]} == 4))
          sha256sum "${ASSETS[@]}" | sed 's#  \./#  #' > SHA256SUMS
          ASSETS+=(SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --draft --title "Multi Codex $GITHUB_REF_NAME" --notes "Multi Codex for Arch Linux and macOS."
          gh release edit "$GITHUB_REF_NAME" --draft=false
