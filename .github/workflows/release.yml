name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tauri

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Validate and apply tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            for (const path of ["package.json", "package-lock.json"]) {
              const doc = JSON.parse(fs.readFileSync(path, "utf8"));
              doc.version = process.env.VERSION;
              if (doc.packages && doc.packages[""]) doc.packages[""].version = process.env.VERSION;
              fs.writeFileSync(path, JSON.stringify(doc, null, 2) + "\n");
            }
            const path = "src-tauri/tauri.conf.json";
            const doc = JSON.parse(fs.readFileSync(path, "utf8"));
            doc.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(doc, null, 2) + "\n");
          '
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "/^name = \"multi-codex-desktop\"$/,/^dependencies = \[/s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.lock

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - run: npm ci
      - run: npm run check:secrets
      - run: npm run test:release
      - run: npm run release:linux

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' ASSETS < <(find src-tauri/target/release/bundle \
            -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -print0 | sort -z)
          ASSETS+=(SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --draft \
            --title "Multi Codex $GITHUB_REF_NAME" \
            --notes "Multi Codex for x86_64 Linux."

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
