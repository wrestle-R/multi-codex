name: Release

on:
  workflow_dispatch:
    inputs:
      sdk_package_run:
        description: Optional existing signed Mac artifact run for SDK-only diagnostics
        required: false
        default: ''
        type: string
      platform:
        description: Native package target for manual acceptance
        required: false
        default: all
        type: choice
        options: [all, linux, macos, windows]
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  linux:
    if: ${{ !inputs.sdk_package_run && (!inputs.platform || inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - name: Validate tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="v$(node -p 'require("./package.json").version')"
          fi
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${RELEASE_TAG#v}"
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const expected = process.env.VERSION;
            const actual = [
              JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              JSON.parse(fs.readFileSync("package-lock.json", "utf8")).version,
              JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1],
              fs.readFileSync("src-tauri/Cargo.lock", "utf8").match(/name = "multi-codex-desktop"\nversion = "([^"]+)"/)?.[1],
            ];
            if (actual.some(version => version !== expected)) {
              throw new Error(`Tag ${expected} does not match committed versions: ${actual.join(", ")}`);
            }
          '
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # Recommended desktop portals wait for a graphical login on headless
          # runners, blocking GTK startup. Required libraries remain installed.
          sudo apt-get install --no-install-recommends -y firejail imagemagick libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdotool xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run test:release
      - run: cargo test --locked --manifest-path ../cli/Cargo.toml -p multi-codex-core
      - run: npm run test:release-gates
      - name: Require signed updater packages
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - run: npm run release:linux
      - name: Exercise native SDK update and signed-payload refusal on Linux
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --example native-updater
          xvfb-run -a python3 scripts/native-updater-smoke.py --harness src-tauri/target/debug/examples/native-updater --payload src-tauri/target/release/bundle/appimage/*.AppImage --output "$RUNNER_TEMP/native-updater-linux/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-updater-linux-evidence
          path: ${{ runner.temp }}/native-updater-linux/
      - name: Remove build-time WebKit to verify self-contained helpers
        run: |
          sudo apt-get remove -y libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0
          if ldconfig -p | grep -Eq 'lib(webkit2gtk|javascriptcoregtk)-4\.1\.so'; then
            echo "System WebKit still present; the catalog test would not prove bundled helper loading" >&2
            exit 1
          fi
      - name: Verify AppImageHub-compatible launch and visible window
        env:
          APPIMAGE_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/appimage-catalog-evidence
        run: bash scripts/appimage-catalog-display-smoke.sh src-tauri/target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-catalog-evidence
          path: ${{ runner.temp }}/appimage-catalog-evidence/
          if-no-files-found: warn
      - name: Verify install and update of the exact Linux candidate
        run: |
          mkdir "$RUNNER_TEMP/linux-installer-assets"
          cp src-tauri/target/release/bundle/appimage/*.AppImage SHA256SUMS "$RUNNER_TEMP/linux-installer-assets/"
          VERSION=$(node -p 'require("./package.json").version')
          python3 scripts/linux-installer-smoke.py "$RUNNER_TEMP/linux-installer-assets" "v$VERSION" "$RUNNER_TEMP/linux-installer-result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer-evidence
          path: ${{ runner.temp }}/linux-installer-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          path: |
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            tauri/src-tauri/target/release/bundle/deb/*.deb
            tauri/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  macos:
    if: ${{ !inputs.sdk_package_run && (!inputs.platform || inputs.platform == 'all' || inputs.platform == 'macos') }}
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - name: Validate tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="v$(node -p 'require("./package.json").version')"
          fi
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${RELEASE_TAG#v}"
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const expected = process.env.VERSION;
            const actual = [
              JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              JSON.parse(fs.readFileSync("package-lock.json", "utf8")).version,
              JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1],
              fs.readFileSync("src-tauri/Cargo.lock", "utf8").match(/name = "multi-codex-desktop"\nversion = "([^"]+)"/)?.[1],
            ];
            if (actual.some(version => version !== expected)) {
              throw new Error(`Tag ${expected} does not match committed versions: ${actual.join(", ")}`);
            }
          '
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build:desktop
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install disposable native VS Code test dependency
        run: |
          curl --fail --location --retry 3 https://update.code.visualstudio.com/latest/darwin-arm64/stable -o "$RUNNER_TEMP/vscode.zip"
          ditto -xk "$RUNNER_TEMP/vscode.zip" /Applications
      - name: Exercise native Keychain and isolated VS Code startup
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml macos_live_keychain_round_trip -- --ignored --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml macos_live_vscode_launch_is_detected -- --ignored --test-threads=1
      - name: Exercise isolated CLI launch in native Terminal
        run: cargo test --manifest-path src-tauri/Cargo.toml macos_live_cli_launch_is_isolated -- --ignored --test-threads=1
      - name: Install official standalone desktop for native launch smoke
        run: |
          # Pin the official version with completed authenticated isolation evidence.
          # The moving Codex.dmg URL can upgrade independently and must not expand the allowlist.
          curl --fail --location --retry 3 https://persistent.oaistatic.com/codex-app-prod/ChatGPT-darwin-arm64-26.930.51102.zip -o "$RUNNER_TEMP/standalone.zip"
          mkdir "$RUNNER_TEMP/standalone-volume"
          ditto -xk "$RUNNER_TEMP/standalone.zip" "$RUNNER_TEMP/standalone-volume"
          DESKTOP_APP=$(find "$RUNNER_TEMP/standalone-volume" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$DESKTOP_APP"
          codesign --verify --deep --strict "$DESKTOP_APP"
          ditto "$DESKTOP_APP" "/Applications/$(basename "$DESKTOP_APP")"
      - name: Verify production standalone launch and restart with long private paths
        run: cargo test --manifest-path src-tauri/Cargo.toml macos_live_standalone_launch_is_detected -- --ignored --test-threads=1
      - name: Build Apple Silicon candidate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for signing_setting in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!signing_setting}" ]] || unset "$signing_setting"
          done
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run tauri -- build --bundles app,dmg --target aarch64-apple-darwin --config src-tauri/tauri.updater.conf.json
      - name: Inspect and smoke-test Apple Silicon app bundle
        run: |
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          BINARY="$APP/Contents/MacOS/$EXECUTABLE"
          test -x "$BINARY"
          test -f "$APP/Contents/Resources/icon.icns"
          ARCHS=$(lipo -archs "$BINARY")
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " != *" x86_64 "* ]]
          python3 scripts/macos-smoke.py "$BINARY"
      - name: Verify Orbit, minimal upgrade notes and packaged close/reopen lifecycle
        env:
          MAC_LIFECYCLE_VARIANT: candidate
        run: |
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          ditto "$APP" '/Applications/Multi Codex.app'
          python3 ../release/scripts/macos-lifecycle-probe.py '/Applications/Multi Codex.app'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-macos-lifecycle-evidence
          path: ${{ runner.temp }}/hud-backend-evidence/candidate/
          if-no-files-found: warn
      - name: Check signing and notarization
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          # Every updater bundle needs a complete Apple Silicon code seal. The
          # default is ad hoc; optional configured Developer ID remains supported.
          codesign --verify --deep --strict "$APP"
          test -f "$APP/Contents/_CodeSignature/CodeResources"
          if [[ -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "Complete ad hoc bundle signature verified; Developer ID and notarization are not configured."
          else
            codesign --verify --deep --strict "$APP"
            if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              xcrun stapler validate "$APP"
              spctl --assess --type execute --verbose "$APP"
            else
              echo "Developer ID signature verified; optional notarization credentials are not configured."
            fi
          fi
      - name: Normalize DMG name
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)
          test -n "$DMG"
          mv "$DMG" "Multi.Codex_${VERSION}_aarch64.dmg"
          UPDATE=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app.tar.gz" -print -quit)
          test -f "$UPDATE.sig"
          cp "$UPDATE" "Multi.Codex_${VERSION}_aarch64.app.tar.gz"
          cp "$UPDATE.sig" "Multi.Codex_${VERSION}_aarch64.app.tar.gz.sig"
      - name: Verify install and update of the exact Mac candidate
        run: |
          mkdir "$RUNNER_TEMP/mac-installer-assets"
          cp Multi.Codex_*_aarch64.dmg "$RUNNER_TEMP/mac-installer-assets/"
          (cd "$RUNNER_TEMP/mac-installer-assets" && shasum -a 256 *.dmg > SHA256SUMS)
          VERSION=$(node -p 'require("./package.json").version')
          python3 scripts/macos-installer-smoke.py "$RUNNER_TEMP/mac-installer-assets" "v$VERSION"
      - name: Exercise native SDK update and signed-payload refusal on macOS
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --example native-updater
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          python3 scripts/native-updater-smoke.py --harness src-tauri/target/debug/examples/native-updater --payload Multi.Codex_*_aarch64.app.tar.gz --app "$APP" --output "$RUNNER_TEMP/native-updater-macos/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-updater-macos-evidence
          path: ${{ runner.temp }}/native-updater-macos/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installer-evidence
          path: ${{ runner.temp }}/multi-codex-macos-installer-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            tauri/Multi.Codex_*_aarch64.dmg
            tauri/Multi.Codex_*_aarch64.app.tar.gz
            tauri/Multi.Codex_*_aarch64.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload macOS startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-startup-evidence-${{ github.workflow }}
          path: ${{ runner.temp }}/multi-codex-macos-evidence/
          if-no-files-found: warn

  windows:
    if: ${{ !inputs.sdk_package_run && (!inputs.platform || inputs.platform == 'all' || inputs.platform == 'windows') }}
    uses: ./.github/workflows/windows.yml
    with:
      signed_updates: true
    secrets: inherit

  extensions:
    if: ${{ !inputs.sdk_package_run && (!inputs.platform || inputs.platform == 'all' || inputs.platform == 'all') }}
    uses: ./.github/workflows/extension.yml

  prepare-draft:
    if: github.event_name != 'workflow_dispatch'
    needs: [linux, macos, windows, extensions]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-assets
          merge-multiple: true
      - name: Prepare release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          find downloaded-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*_x64-setup.exe' -o -name '*.vsix' \) -exec cp {} release-assets/ \;
          cd release-assets
          mapfile -d '' ASSETS < <(find . -maxdepth 1 -type f -print0 | sort -z)
          ((${#ASSETS[@]} == 9))
          cp ../scripts/install-app.sh ../scripts/update-app.sh ../scripts/install-app.ps1 ../scripts/update-app.ps1 .
          ASSETS+=(./install-app.sh ./update-app.sh ./install-app.ps1 ./update-app.ps1)
          find ../downloaded-assets -type f \( -name "*.AppImage.sig" -o -name "*.exe.sig" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) -exec cp {} . \;
          node ../tauri/scripts/updater-manifest.mjs . "${GITHUB_REF_NAME#v}"
          mapfile -d '' ASSETS < <(find . -maxdepth 1 -type f -print0 | sort -z)
          sha256sum "${ASSETS[@]}" | sed 's#  \./#  #' > SHA256SUMS
          ASSETS+=(SHA256SUMS)
          cd ..
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" == "true" ]]
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --draft --title "Multi Codex $GITHUB_REF_NAME — validation pending" --notes ''
          fi
          echo "Draft created. Validate exact assets, then publish manually with a short website link."

  mac-sdk-probe:
    if: inputs.sdk_package_run
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
          cache-on-failure: true
      - name: Record exact candidate workflow source
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.sdk_package_run }}
        run: |
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ ]]
          SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" --jq .head_sha)
          echo "NATIVE_UPDATER_CANDIDATE_SOURCE=$SOURCE" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: candidate
          run-id: ${{ inputs.sdk_package_run }}
          github-token: ${{ github.token }}
      - name: Compile pinned SDK harness without rebuilding the candidate
        run: |
          mkdir -p tauri/resources/managed-extension
          cargo build --locked --manifest-path tauri/src-tauri/Cargo.toml --example native-updater
      - name: Inspect actual signed candidate and native SDK replacement
        run: |
          mkdir candidate/source
          tar -xzf candidate/*.app.tar.gz -C candidate/source
          APP=$(find candidate/source -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          python3 tauri/scripts/native-updater-smoke.py --harness tauri/src-tauri/target/debug/examples/native-updater --payload candidate/*.app.tar.gz --app "$APP" --output "$RUNNER_TEMP/native-updater-macos/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-updater-macos-evidence
          path: ${{ runner.temp }}/native-updater-macos/
