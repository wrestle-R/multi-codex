[package]
name = "multi-codex-core"
version = "1.7.3"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
desktop-icons = ["dep:gio"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs2 = "0.4"
keyring = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
sysinfo = "0.37"
tempfile = "3"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "0.18", optional = true }
zbus = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }
