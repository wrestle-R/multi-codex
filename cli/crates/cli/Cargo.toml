[package]
name = "multi-codex-cli"
version = "1.0.5"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "multi-codex"
path = "src/main.rs"

[dependencies]
multi-codex-core = { path = "../core" }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[[bin]]
name = "multi-codex-account-helper"
path = "src/account-helper.rs"
